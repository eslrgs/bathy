[project]
name = "bathy"
version = "0.1.0"
description = "Lightweight Python package for exploring bathymetry data."
readme = "README.md"
authors = [
    { name = "eslrgs", email = "euan-soutter@hotmail.co.uk" }
]
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["bathymetry", "geomorphology", "oceanography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "xarray>=2024.1.0",
    "netcdf4>=1.6.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "geographiclib>=2.0",
    "geopandas>=0.14.0",
    "pydap>=3.5.8",
    "cmocean>=4.0.0",
    "rioxarray>=0.15.0",
    "polars>=1.0.0",
    "tqdm>=4.66.0",
    "pooch>=1.7.0",
]

[project.urls]
Homepage = "https://github.com/eslrgs/bathy"
Repository = "https://github.com/eslrgs/bathy"
Documentation = "https://eslrgs.github.io/bathy/"
Issues = "https://github.com/eslrgs/bathy/issues"

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "ipympl>=0.9.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    "ruff>=0.14.8",
    "pytest>=8.0.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocstrings[python]>=1.0.3",
    "mkdocs-jupyter>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = ["tests/", "examples/", "docs/", "data/", "site/", "**/.DS_Store"]
wheel-exclude = ["**/.DS_Store"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
