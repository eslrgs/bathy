site_name: bathy
site_description: Lightweight Python package for exploring bathymetry data
site_url: https://eslrgs.github.io/bathy
repo_url: https://github.com/eslrgs/bathy
repo_name: eslrgs/bathy

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocs-jupyter:
      execute: false
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide:
      - Loading Data: guide/loading-data.md
      - Projected Coordinate Systems: guide/projections.md
      - Profiles: guide/profiles.md
      - Visualisation: guide/visualisation.md
  - Examples:
      - Basic Usage: examples/basic_usage.ipynb
      - Profiles: examples/profiles.ipynb
      - Interactive: examples/interactive.ipynb
  - API Reference:
      - IO: api/io.md
      - Analysis: api/analysis.md
      - Plotting: api/plot.md
      - Profile: api/profile.md
      - Interactive: api/interactive.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
